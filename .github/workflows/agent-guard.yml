# CI-004 — the autonomous issue worker's own guard rails.
#
# What this proves, and what it does not
# --------------------------------------
# It proves that .github/agent/agent-guard.sh still REJECTS every failure mode
# it was written for — a bot identity, an AI attribution trailer, a push to
# main, a force-push, an issue nobody approved, an open blocker, a fetch that
# failed — and still ACCEPTS the good case, and that the worker's permission
# file is valid JSON that still denies merging. It runs on GitHub-hosted
# runners, needs no secret, and never runs the worker or Claude.
#
# It says nothing about whether the worker is enabled, or safe to enable: that
# is the owner's decision, recorded in docs/development/AGENT-WORKFLOW.md.

name: Agent · guard rails

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/agent/**'
      - '.github/workflows/agent-*.yml'
      - '.claude/skills/pliwee-issue-worker/**'
      - 'packaging/tests/lib/assert.sh'
  push:
    branches: [main, develop]
    paths:
      - '.github/agent/**'
      - '.github/workflows/agent-*.yml'
      - '.claude/skills/pliwee-issue-worker/**'
      - 'packaging/tests/lib/assert.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: agent-guard.sh self-test, shellcheck, settings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Shell parses
        run: |
          for f in .github/agent/agent-guard.sh .github/agent/worker-commit.sh .github/agent/coordinator.sh .github/agent/sandbox.sh .github/agent/worker-pipeline.sh .github/agent/identity/*.sh .github/agent/hooks/*; do
              bash -n "$f" && printf '  ok    %s parses\n' "$f"
          done

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning .github/agent/agent-guard.sh .github/agent/worker-commit.sh .github/agent/coordinator.sh .github/agent/sandbox.sh .github/agent/worker-pipeline.sh .github/agent/identity/*.sh .github/agent/hooks/*

      - name: The hooks are executable and call the guard
        run: |
          set -eu
          for h in commit-msg pre-push; do
              f=".github/agent/hooks/$h"
              [ -x "$f" ] || { echo "::error::$f is not executable; git would skip it silently"; exit 1; }
              grep -q 'agent-guard.sh' "$f" || { echo "::error::$f no longer calls agent-guard.sh"; exit 1; }
              echo "  ok    $f"
          done

      - name: agent-guard.sh --selftest — every check rejects what it must
        run: ./.github/agent/agent-guard.sh --selftest

      - name: coordinator.sh --selftest — the night state machine fails closed
        run: ./.github/agent/coordinator.sh --selftest

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # which bubblewrap needs. The runner is throwaway; the restriction is
      # lifted for this job only, so the sandbox's own tests can run.
      - name: sandbox.sh and worker-pipeline.sh --selftest — no credential, nothing planted runs outside
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          ./.github/agent/sandbox.sh --selftest
          ./.github/agent/worker-pipeline.sh --selftest

      - name: The worker runs Claude only inside the sandbox
        run: |
          set -eu
          f=.github/workflows/agent-issue-worker.yml
          n="$(grep -c 'claude -p' "$f")"
          [ "$n" = 1 ] || { echo "::error::$f invokes claude $n times; expected exactly one, sandboxed"; exit 1; }
          # shellcheck disable=SC2016  # a literal line of the workflow, not an expansion
          grep -B6 'claude -p' "$f" | grep -Fq '"$SANDBOX" run --work "$WORK" --outbox "$OUTBOX" --' \
              || { echo "::error::claude -p is not run through sandbox.sh"; exit 1; }
          if grep -nE '^[[:space:]]*GH_TOKEN:' <(sed -n '/Work the issue/,/- name:/p' "$f"); then
              echo "::error::the Claude step is given a token"; exit 1
          fi
          s=.github/agent/claude-settings.json
          jq -e '.permissions.deny | index("Bash(gh:*)") != null' "$s" >/dev/null || { echo "::error::$s does not deny gh"; exit 1; }
          if jq -e '.permissions.allow[] | select(startswith("Bash(gh"))' "$s" >/dev/null; then
              echo "::error::$s allows gh"; exit 1
          fi
          echo "  ok    one claude invocation, through sandbox.sh, no token, no gh"

      - name: Worker permissions — fixed commit wrapper, merging stays denied
        run: |
          set -eu
          f=.github/agent/claude-settings.json
          jq -e . "$f" > /dev/null

          jq -e '.permissions.allow | index("Bash(./.github/agent/worker-commit.sh:*)") != null' "$f" > /dev/null \
              || { echo "::error::$f does not allow worker-commit.sh"; exit 1; }

          if jq -e '.permissions.allow[] | select(startswith("Bash(git commit"))' "$f" > /dev/null; then
              echo "::error::$f still allows direct git commit"
              exit 1
          fi

          jq -e '.permissions.deny | index("Bash(git commit:*)") != null' "$f" > /dev/null \
              || { echo "::error::$f does not deny direct git commit"; exit 1; }

          grep -Fq './.github/agent/worker-commit.sh' .claude/skills/pliwee-issue-worker/SKILL.md \
              || { echo "::error::skill does not use worker-commit.sh"; exit 1; }

          if grep -Eq '^[[:space:]]*git commit([[:space:]]|$)' .claude/skills/pliwee-issue-worker/SKILL.md; then
              echo "::error::skill still contains direct git commit"
              exit 1
          fi
          for rule in 'Bash(gh pr merge:*)' 'Bash(gh pr ready:*)' 'Bash(gh pr edit --add-reviewer:*)' 'Bash(git push --force:*)' \
                      'Bash(git push --no-verify:*)' 'Bash(git commit --no-verify:*)' 'Bash(git config:*)' \
                      'Edit(.github/workflows/**)' 'Edit(AGENTS.md)'; do
              jq -e --arg r "$rule" '.permissions.deny | index($r) != null' "$f" > /dev/null \
                  || { echo "::error::$f no longer denies $rule"; exit 1; }
              echo "  ok    denies $rule"
          done
          if jq -e '.permissions.allow[] | select(test("merge|--force|--no-verify|bypass"; "i"))' "$f" > /dev/null; then
              echo "::error::$f allows something it must deny"; exit 1
          fi
          echo "  ok    allows nothing that merges, force-pushes or skips hooks"

      - name: Owner merge — integration commit provenance stays enforced
        run: |
          set -eu
          f=.github/workflows/agent-owner-merge.yml

          for needle in \
              'base_sha="$(jq -r .base.sha' \
              'APPROVED_BASE_SHA:' \
              'main changed after owner approval; review again' \
              'merge_commit_sha' \
              '(.parents | length) == 2' \
              '.parents[0].sha == $base' \
              '.parents[1].sha == $head'; do
              grep -Fq "$needle" "$f" || {
                  echo "::error::$f lost integration provenance check: $needle"
                  exit 1
              }
          done

          echo "  ok    owner merge pins base + head and verifies both merge parents"
