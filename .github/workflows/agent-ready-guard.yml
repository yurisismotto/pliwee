# Agent — a worker PR leaves Draft only by the owner's hand.
#
# GitHub requires Pull requests:write both to create a Draft PR and to change
# Draft/Ready state. The PR broker therefore technically has that capability.
# The worker App itself has no Pull requests permission.
#
# This workflow is the compensating control for broker-originated Ready events.
# It runs on a GitHub-hosted runner, executes no repository code and checks out
# nothing. It mints a short-lived token for pliwee-pr-broker solely to return
# the PR to Draft.
#
# Merge authorization does NOT depend on this workflow. The server-side
# owner/admin-only protected-ref update rule is the final merge boundary.

name: Agent · ready guard

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  guard:
    if: >-
      startsWith(github.head_ref, 'feature/issue-') &&
      endsWith(github.head_ref, '-worker') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != github.repository_owner

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      PR_ID: ${{ github.event.pull_request.node_id }}
      PR: ${{ github.event.pull_request.number }}
      WHO: ${{ github.event.sender.login }}

    steps:
      - name: Mint PR broker token
        id: broker
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PLIWEE_PR_BROKER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLIWEE_PR_BROKER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Back to Draft
        env:
          GH_TOKEN: ${{ steps.broker.outputs.token }}
        run: |
          set -eu

          d="$(
            gh api graphql \
              -f query='mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
              -f id="$PR_ID" \
              --jq '.data.convertPullRequestToDraft.pullRequest.isDraft'
          )"

          [ "$d" = true ] || {
            echo "::error::could not return #$PR to Draft: '$d'"
            exit 1
          }

          gh pr comment \
            "$PR" \
            -R "$GITHUB_REPOSITORY" \
            --body "Returned to Draft: \`$WHO\` marked this autonomous worker PR ready for review. Final review state and merge authorization remain with the repository owner."

          echo "::warning::$WHO marked worker PR #$PR ready; reverted to Draft"
